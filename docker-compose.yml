services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: securepay
      POSTGRES_USER: securepay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "5432:5432"
    volumes:
      - securepay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securepay -d securepay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  securepay-postgres:
